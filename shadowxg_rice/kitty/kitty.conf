# /* ---- 💫 ShadowXG Premium Glassy Kitty Config 💫 ---- */

# 🎨 Dynamic Colors (Wallust)
include ~/.config/kitty/wallust/colors-kitty.conf

# 🔤 Typography
font_family      Anomaly Mono
font_size        14.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# 🪟 Glassmorphism & Visuals
background_opacity 0.6
dynamic_background_opacity yes
background_blur 25
confirm_os_window_close 0
cursor_trail 1
window_padding_width 12

# 🚨 ULTRA VISIBILITY OVERRIDES
# These colors ensure your ZSH commands and prompts are NEVER invisible on anime backgrounds.
# We override the dark/muddy greens and blues generated by some Wallust themes.

foreground #F8F8F2
background #121212
selection_foreground #121212
selection_background #F8F8F2

# Command visibility (Green) - Pure vibrant green
color2  #50FA7B
color10 #50FA7B

# Path/Info visibility (Blue) - Vibrant Sky Blue
color4  #8BE9FD
color12 #8BE9FD

# Prompt/User visibility (Green segment in Agnoster)
# We force these to be brighter than the background blur
color0  #282A36
color7  #F8F8F2
color8  #6272A4
color15 #FFFFFF
